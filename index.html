<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kids Food Tracker</title>
  <link rel="icon" type="image/svg+xml" href="./Favicon.svg?v=2">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container { max-width: 600px; margin: 0 auto; }

    h1 {
      color: white;
      text-align: center;
      margin-bottom: 30px;
      font-size: 2rem;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    h2 { margin-bottom: 16px; color: #333; font-size: 1.3rem; }

    .form-group { margin-bottom: 16px; }

    label.field-label {
      display: block;
      margin-bottom: 6px;
      color: #555;
      font-weight: 500;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus { outline: none; border-color: #667eea; }

    .kid-picker { display: flex; gap: 10px; flex-wrap: wrap; }

    .kid-option { position: relative; flex: 1; min-width: 110px; }

    .kid-option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .kid-option span {
      display: block;
      text-align: center;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      color: #555;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s;
    }

    .kid-option input:focus-visible + span { border-color: #667eea; }

    .kid-option input:checked + span.lillian { background: #ffd6e8; border-color: #c2185b; color: #c2185b; }
    .kid-option input:checked + span.nolan { background: #c5e1ff; border-color: #1565c0; color: #1565c0; }
    .kid-option input:checked + span.maybelle { background: #d4edda; border-color: #155724; color: #155724; }

    .hint { font-size: 0.85rem; color: #888; margin-top: 6px; }

    .error { color: #c62828; font-size: 0.9rem; margin-top: 8px; display: none; }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }

    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.6; cursor: wait; }

    .restaurant-item {
      background: #f8f9fa;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 12px;
      border-left: 4px solid #667eea;
    }

    .restaurant-name {
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
      font-size: 1.1rem;
    }

    .food-entry { padding: 6px 0; color: #555; }

    .kid-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 500;
      margin-right: 6px;
    }

    .kid-lillian { background: #ffd6e8; color: #c2185b; }
    .kid-nolan { background: #c5e1ff; color: #1565c0; }
    .kid-maybelle { background: #d4edda; color: #155724; }

    .empty-state { text-align: center; color: #999; padding: 40px 20px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🍽️ Kids Food Tracker</h1>

    <div class="card">
      <h2>Add New Entry</h2>
      <form id="entryForm">
        <div class="form-group">
          <label class="field-label" for="restaurant">Restaurant</label>
          <input type="text" id="restaurant" list="restaurantOptions" autocomplete="off" placeholder="Start typing a restaurant" required>
          <datalist id="restaurantOptions"></datalist>
        </div>

        <div class="form-group">
          <label class="field-label" for="food">Food</label>
          <input type="text" id="food" placeholder="What did they like?" required>
        </div>

        <div class="form-group">
          <label class="field-label">Who liked it?</label>
          <div class="kid-picker">
            <label class="kid-option">
              <input type="checkbox" name="kid" value="Lillian">
              <span class="lillian">Lillian</span>
            </label>
            <label class="kid-option">
              <input type="checkbox" name="kid" value="Nolan">
              <span class="nolan">Nolan</span>
            </label>
            <label class="kid-option">
              <input type="checkbox" name="kid" value="Maybelle">
              <span class="maybelle">Maybelle</span>
            </label>
          </div>
          <div class="hint">Tap more than one if they all liked it.</div>
          <div class="error" id="kidError">Pick at least one kid.</div>
        </div>

        <button type="submit" id="submitBtn">Add Entry</button>
      </form>
    </div>

    <div class="card">
      <h2>Food by Restaurant</h2>
      <div id="restaurantList"></div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbweBrWzae4niKi2b8yety6GzYOQJtsrm2gmZfyxa0mh0zZOPpQbHgKn9gv3M8IbKVtC/exec';

    let allEntries = [];

    function esc(str) {
      return String(str).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    async function loadData() {
      try {
        const response = await fetch(SCRIPT_URL + '?action=read', { redirect: 'follow' });
        const data = await response.json();
        allEntries = data.entries || [];
        renderRestaurants();
        renderRestaurantOptions();
      } catch (error) {
        console.error('Error loading data:', error);
      }
    }

    function renderRestaurantOptions() {
      const names = [...new Set(allEntries.map(e => e.restaurant))].sort((a, b) => a.localeCompare(b));
      document.getElementById('restaurantOptions').innerHTML =
        names.map(n => '<option value="' + esc(n) + '"></option>').join('');
    }

    function renderRestaurants() {
      const listEl = document.getElementById('restaurantList');

      if (allEntries.length === 0) {
        listEl.innerHTML = '<div class="empty-state">No entries yet. Add your first one above!</div>';
        return;
      }

      const byRestaurant = {};
      allEntries.forEach(entry => {
        if (!byRestaurant[entry.restaurant]) byRestaurant[entry.restaurant] = [];
        byRestaurant[entry.restaurant].push(entry);
      });

      const restaurantNames = Object.keys(byRestaurant).sort((a, b) => a.localeCompare(b));

      listEl.innerHTML = restaurantNames.map(restaurant => {
        // Group by food so kids who liked the same thing share one line
        const byFood = {};
        byRestaurant[restaurant].forEach(e => {
          const key = e.food.trim().toLowerCase();
          if (!byFood[key]) byFood[key] = { food: e.food, kids: [] };
          if (!byFood[key].kids.includes(e.kid)) byFood[key].kids.push(e.kid);
        });

        const foodItems = Object.values(byFood).map(item => {
          const badges = item.kids.map(k =>
            '<span class="kid-badge kid-' + esc(k.toLowerCase()) + '">' + esc(k) + '</span>'
          ).join('');
          return '<div class="food-entry">' + badges + esc(item.food) + '</div>';
        }).join('');

        return '<div class="restaurant-item">' +
          '<div class="restaurant-name">' + esc(restaurant) + '</div>' +
          foodItems +
        '</div>';
      }).join('');
    }

    document.getElementById('entryForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const restaurant = document.getElementById('restaurant').value.trim();
      const food = document.getElementById('food').value.trim();
      const kids = [...document.querySelectorAll('input[name="kid"]:checked')].map(c => c.value);
      const kidError = document.getElementById('kidError');

      if (kids.length === 0) {
        kidError.style.display = 'block';
        return;
      }
      kidError.style.display = 'none';

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Adding...';

      try {
        // One row per kid, sent together
        await Promise.all(kids.map(kid => {
          const url = SCRIPT_URL +
            '?action=add' +
            '&restaurant=' + encodeURIComponent(restaurant) +
            '&food=' + encodeURIComponent(food) +
            '&kid=' + encodeURIComponent(kid);
          return fetch(url, { redirect: 'follow' });
        }));

        document.getElementById('restaurant').value = '';
        document.getElementById('food').value = '';
        document.querySelectorAll('input[name="kid"]').forEach(c => c.checked = false);

        await loadData();
      } catch (error) {
        console.error('Error adding entry:', error);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Add Entry';
      }
    });

    loadData();
  </script>
</body>
</html>
